
name: Generate and Publish Holiday Calendar

on:
  push:
    branches:
      - main

  schedule:
    - cron: '17 8 1 * *'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install holidays icalendar python-dateutil

      - name: Generate calendar
        run: python generate.py

      - name: Upload calendar
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish calendar
        id: deployment
        uses: actions/deploy-pages@v5
